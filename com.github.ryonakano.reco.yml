id: com.github.ryonakano.reco
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: com.github.ryonakano.reco
finish-args:
  # A workaround for the issue of xdg-desktop-portal-gnome that the selected folder in the file chooser is not set as writable.
  # See:
  # https://gitlab.gnome.org/GNOME/xdg-desktop-portal-gnome/-/issues/41
  # https://github.com/ryonakano/reco/issues/175#issuecomment-1848263345
  # TODO: Remove when famous distribution versions that uses GNOME < 44 reach EOL
  - --filesystem=home

  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --env=GST_PLUGIN_PATH_1_0=/app/lib/gstreamer-1.0
  - --metadata=X-DConf=migrate-path=/com/github/ryonakano/reco/
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
build-options:
  libdir: /app/lib
modules:
  - name: live-chart
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/lcallarec/live-chart/archive/1.10.0.tar.gz
        sha256: 3f54c7569cc2a4711b5689038055aefc4321636f3e6dd4945e4be204bc9d4843

  - name: gst-libav
    buildsystem: meson
    config-opts:
      - -Ddoc=disabled
    sources:
      - type: archive
        # we need to use the same version with gstreamer included in the sdk
        url: https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-1.26.10.tar.xz
        sha256: c8c2fd29cc063a6d26c314cd1a0a3a3060c8a029981b9520fab52c4206d11611

  - name: ryokucha
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/ryonakano/ryokucha/archive/0.4.0.tar.gz
        sha256: b7bebd8caba5b33714958f6014f3bfedfbb3b5d92b0f046c0b0ab1a8fde0bcc2

  - name: reco
    buildsystem: meson
    config-opts:
      - -Duse_submodule=false
    sources:
      - type: git
        url: https://github.com/ryonakano/reco.git
        tag: 5.2.0-rc.1
        commit: 309c01e41b2c9003c88f1f5b8db903f6ac690c5f
